# ============================================================
# Blog VPS 部署流水线 (Docker + GHCR + SSH)
# ============================================================
# 2026-06: 从 Cloudflare Workers 迁移至 VPS Docker
# 推送 main/test 分支且 blog 相关文件变更时自动触发
# 流程: 安装依赖 → 质量检查 → Docker 构建 + 推送 GHCR → SSH 部署到 VPS
# ============================================================

name: Deploy Blog (VPS)

on:
  push:
    branches: [main, test]
    paths:
      - "apps/frontend-blog/**"
      - "packages/shared/**"
      - "packages/ui/**"
      - "apps/frontend-blog/Dockerfile"
      - ".github/workflows/deploy-blog-cloudflare.yml"
  workflow_dispatch:
    inputs:
      runner:
        description: "🖥️ Runner (ubuntu-latest = GitHub托管 / self-hosted = 本地Mac算力)"
        type: choice
        options: [ubuntu-latest, self-hosted]
        default: ubuntu-latest
  workflow_call:
    inputs:
      runner:
        description: "Runner to use"
        type: string
        default: ubuntu-latest

concurrency:
  group: deploy-blog-vps
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/mrbigporter/lucky-frontend-blog-prod

jobs:
  # =========================================
  # 阶段零: 代码质量检查 (硬门禁)
  # =========================================
  quality:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Enable Corepack (Yarn 4)
        run: corepack enable && corepack prepare yarn@4.9.2 --activate

      # ---- 四级缓存策略 ----
      - name: Cache Yarn zip cache
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Cache node_modules
        uses: actions/cache@v4
        id: nm-cache
        with:
          path: |
            node_modules
            apps/frontend-blog/node_modules
            packages/*/node_modules
          key: nm-blog-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            nm-blog-${{ runner.os }}-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-blog-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-blog-${{ github.ref_name }}-
            turbo-blog-main-

      - name: Cache Next.js build (.next/cache)
        uses: actions/cache@v4
        with:
          path: |
            apps/frontend-blog/.next/cache
          key: nextjs-blog-${{ runner.os }}-${{ hashFiles('yarn.lock', 'apps/frontend-blog/**/*.ts', 'apps/frontend-blog/**/*.tsx', 'apps/frontend-blog/**/*.json') }}
          restore-keys: |
            nextjs-blog-${{ runner.os }}-

      - name: 4. Install Dependencies
        run: yarn install --immutable

      - name: 5. Build shared packages
        run: |
          node packages/shared/scripts/build.js &
          node packages/ui/scripts/build.js &
          wait

      - name: 6. Lint + Typecheck + Unit tests (frontend-blog)
        run: |
          yarn workspace @lucky/frontend-blog lint
          yarn workspace @lucky/frontend-blog type-check
          yarn workspace @lucky/frontend-blog test

      # ---- 缓存构建产物供 deploy job 复用 ----
      - name: Archive built packages
        uses: actions/upload-artifact@v4
        with:
          name: built-packages
          path: |
            packages/shared/dist
            packages/ui/dist
          retention-days: 1

  # =========================================
  # 阶段一: Docker 构建 + 推送镜像到 GHCR
  # =========================================
  build:
    needs: quality
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 3. Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 4. Docker meta (生成标签)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: 5. Build & Push frontend-blog image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/frontend-blog/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =========================================
  # 阶段二: SSH 部署到 VPS
  # =========================================
  deploy:
    needs: build
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}

    steps:
      - name: 1. Checkout Code (for deploy scripts)
        uses: actions/checkout@v4

      - name: 2. Validate SSH connectivity
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail

          HOST="${SSH_HOST:-}"
          PORT="${SSH_PORT:-22}"

          if [ -z "$HOST" ]; then
            echo "::error::SSH_HOST is empty. Please set repository/environment secret SSH_HOST."
            exit 1
          fi

          echo "Preflight: probing ${HOST}:${PORT} from runner..."

          OK=0
          for i in 1 2 3; do
            if nc -zvw5 "$HOST" "$PORT"; then
              OK=1
              echo " SSH port reachable on attempt #$i"
              break
            fi
            echo "⚠️ Attempt #$i failed, retrying in 5s..."
            sleep 5
          done

          if [ "$OK" -ne 1 ]; then
            echo "::error::Runner cannot reach ${HOST}:${PORT}."
            echo "::error::Check SSH_HOST/SSH_PORT secrets, VPS firewall/security group."
            exit 1
          fi

      - name: 3. Deploy via SSH (登录 VPS 拉取镜像 + 重启服务)
        uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.VPS_GHCR_PAT }}
          GHCR_USER: ${{ github.repository_owner }}
          IMAGE: ${{ env.IMAGE_NAME }}:latest
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT != '' && secrets.SSH_PORT || 22 }}
          timeout: 120s
          command_timeout: 15m
          debug: true
          envs: GHCR_TOKEN,GHCR_USER,IMAGE
          script: |
            set -e
            cd /opt/lucky

            retry() {
              local max="$1"
              local delay="$2"
              shift 2
              local n=1
              while true; do
                if "$@"; then
                  return 0
                fi
                if [ "$n" -ge "$max" ]; then
                  echo "❌ command failed after ${n} attempts: $*"
                  return 1
                fi
                echo "⚠️ attempt ${n} failed, retry in ${delay}s: $*"
                n=$((n + 1))
                sleep "$delay"
              done
            }

            # 0. 预检 VPS 出海网络连通性
            echo "→ 预检 GitHub 连通性..."
            retry 4 5 curl -fsS --max-time 15 https://github.com >/dev/null

            # 1. 登录 GHCR
            echo "→ 登录 GHCR..."
            retry 4 8 sh -c 'echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin'

            # 2. 拉取新镜像
            echo "→ 拉取镜像: $IMAGE"
            retry 4 10 docker pull "$IMAGE"

            # 3. 保存当前前端博客镜像 SHA (用于回滚)
            PREV_IMAGE_SHA=$(docker inspect lucky-frontend-blog-prod \
              --format '{{.Image}}' 2>/dev/null || echo "")

            # 4. 用新镜像重启前端博客
            echo "→ 重启 frontend-blog 容器..."
            FRONTEND_BLOG_IMAGE="$IMAGE" docker compose -f compose.prod.yml \
              --env-file deploy/.env.prod \
              up -d --no-build --force-recreate frontend-blog

            # 5. 健康检查 (页面访问 + 容器状态)
            echo "→ 等待 frontend-blog 就绪 (最多 60s)..."
            HEALTHY=false
            for i in $(seq 1 20); do
              if docker exec lucky-frontend-blog-prod \
                wget -qO- --timeout=10 http://localhost:3000/en >/dev/null 2>&1; then
                echo " 前端博客响应正常 (第 ${i} 次, 约 $((i*3))s)"
                HEALTHY=true
                break
              fi
              sleep 3
            done

            # 6. 健康检查失败 → 自动回滚
            if [ "$HEALTHY" = false ]; then
              echo "❌ 健康检查超时! 正在回滚..."
              docker logs --tail=50 lucky-frontend-blog-prod
              if [ -n "$PREV_IMAGE_SHA" ]; then
                echo "→ 回滚到旧镜像: ${IMAGE%%:*}@${PREV_IMAGE_SHA}"
                FRONTEND_BLOG_IMAGE="${IMAGE%%:*}@${PREV_IMAGE_SHA}" \
                  docker compose -f compose.prod.yml \
                  --env-file deploy/.env.prod \
                  up -d --no-build --force-recreate frontend-blog
                echo "⚠️  已回滚到旧版本！"
              fi
              exit 1
            fi

            # 7. 热重载 nginx 配置 (确保 tarsierlabs.app server block 生效)
            echo "→ 校验并重载 nginx 配置..."
            if docker exec lucky-nginx-prod nginx -t 2>&1; then
              docker exec lucky-nginx-prod nginx -s reload
              echo " nginx 配置重载成功"
            else
              echo "⚠️ nginx 配置语法错误！保留旧配置，请检查 nginx/nginx.prod.conf"
            fi

            # 8. 状态报告
            docker compose -f compose.prod.yml ps

            # 9. 清理旧镜像
            docker image prune -f

      - name: 4. Verify frontend-blog from runner (外部验证)
        id: verify
        continue-on-error: true
        timeout-minutes: 2
        env:
          BLOG_URL: https://tarsierlabs.app
        run: |
          set -euo pipefail
          echo "→ Verifying frontend-blog from GitHub runner..."
          echo ""

          HTTP_CODE=$(curl --silent --show-error --location \
            --max-time 15 \
            --output /dev/null \
            --write-out "%{http_code}" \
            "$BLOG_URL" 2>&1) || HTTP_CODE=000

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 500 ]; then
            echo "✅ Blog responds with HTTP $HTTP_CODE"
          else
            echo "⚠️ Blog returned HTTP $HTTP_CODE (non-fatal — DNS may not point to VPS yet)"
          fi
          echo ""
          echo "✅ Verification complete"

      - name: 5. Publish Deployment Summary
        if: always()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Blog VPS Deployment

          - Environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
          - Commit: \`${{ github.sha }}\`
          - URL: https://tarsierlabs.app
          - Image: ${{ env.IMAGE_NAME }}:latest
          EOF

      - name: 6. Send Telegram Notification
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS_EMOJI=" Success"
          STATUS_TEXT="✅ Success"

          if [ "${{ job.status }}" != "success" ]; then
            STATUS_EMOJI="❌ Failed"
            STATUS_TEXT="❌ Failed"
          fi

          if [ "${{ steps.verify.outcome }}" = "failure" ]; then
            STATUS_EMOJI="⚠️ Partial"
            STATUS_TEXT="⚠️ Deploy OK but external verification failed"
          fi

          MESSAGE="🐳 *Blog VPS Deployment Report*
          📌 *Status*: $STATUS_TEXT
          🏷️ *Environment*: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }} (VPS Docker)
          🔗 *Blog URL*: [tarsierlabs.app](https://tarsierlabs.app)
          📝 *Commit*: \`${{ github.sha }}\`"

          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" \
              -d "text=$MESSAGE" \
              -d "parse_mode=Markdown" > /dev/null
          fi
