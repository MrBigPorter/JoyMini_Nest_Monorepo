# ============================================================
# Blog Cloudflare Pages 部署流水线
# ============================================================
# 推送 main/test 分支且 blog 相关文件变更时自动触发
# 流程: 安装依赖 → 构建共享包 → opennextjs-cloudflare 构建 → 部署 → 通知
# ============================================================

name: Deploy Blog (Cloudflare)

on:
  push:
    branches: [main, test]
    paths:
      - "apps/frontend-blog/**"
      - "packages/shared/**"
      - "packages/ui/**"
      - ".github/workflows/deploy-blog-cloudflare.yml"
  workflow_dispatch:
    inputs:
      runner:
        description: "🖥️ Runner (ubuntu-latest = GitHub托管 / self-hosted = 本地Mac算力)"
        type: choice
        options: [ubuntu-latest, self-hosted]
        default: ubuntu-latest
  workflow_call:
    inputs:
      runner:
        description: "Runner to use"
        type: string
        default: ubuntu-latest

concurrency:
  group: deploy-blog-cloudflare-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  quality:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Enable Corepack (Yarn 4)
        run: corepack enable && corepack prepare yarn@4.9.2 --activate

      # ---- 三级缓存策略 ----
      - name: Cache Yarn zip cache
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Cache node_modules
        uses: actions/cache@v4
        id: nm-cache
        with:
          path: |
            node_modules
            apps/frontend-blog/node_modules
            packages/*/node_modules
          key: nm-blog-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            nm-blog-${{ runner.os }}-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-blog-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-blog-${{ github.ref_name }}-
            turbo-blog-main-

      - name: 4. Install Dependencies
        run: yarn install --immutable

      - name: 5. Build shared packages
        run: |
          node packages/shared/scripts/build.js &
          node packages/ui/scripts/build.js &
          wait

      - name: 6. Lint + Typecheck + Unit tests (frontend-blog)
        run: |
          yarn workspace @lucky/frontend-blog lint
          yarn workspace @lucky/frontend-blog type-check
          yarn workspace @lucky/frontend-blog test

      # ---- 缓存构建产物供deploy job复用 ----
      - name: Archive built packages
        uses: actions/upload-artifact@v4
        with:
          name: built-packages
          path: |
            packages/shared/dist
            packages/ui/dist
          retention-days: 1

  deploy:
    needs: quality
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Enable Corepack (Yarn 4)
        run: corepack enable && corepack prepare yarn@4.9.2 --activate

      # ---- 复用缓存 ----
      - name: Cache Yarn zip cache
        uses: actions/cache@v4
        with:
          path: |
            .yarn/cache
            .yarn/install-state.gz
          key: yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-

      - name: Cache node_modules
        uses: actions/cache@v4
        id: nm-cache
        with:
          path: |
            node_modules
            apps/frontend-blog/node_modules
            packages/*/node_modules
          key: nm-blog-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: |
            nm-blog-${{ runner.os }}-

      - name: 4. Install Dependencies
        run: yarn install --immutable

      # ---- 直接复用quality job已经构建好的包，避免重复构建 ----
      - name: Download pre-built packages
        uses: actions/download-artifact@v4
        with:
          name: built-packages

      - name: 5.1 Prepare Build Metadata
        id: build_meta
        run: |
          echo "deployed_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "git_sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: 6. Build Blog for Cloudflare Pages
        working-directory: apps/frontend-blog
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_IMG_BASE_URL: ${{ secrets.NEXT_PUBLIC_IMG_BASE_URL }}
          NEXT_PUBLIC_APP_ENV: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
          NEXT_PUBLIC_SENTRY_DEBUG: ${{ github.ref_name == 'test' && 'true' || 'false' }}
          NEXT_PUBLIC_DEPLOYED_AT: ${{ steps.build_meta.outputs.deployed_at }}
          NEXT_PUBLIC_GIT_SHA: ${{ steps.build_meta.outputs.git_sha }}
        run: |
          # opennextjs-cloudflare build auto-reads open-next.config.ts — no -c needed.
          yarn exec opennextjs-cloudflare build

      - name: 7. Validate Cloudflare Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set in GitHub secrets."
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID is not set in GitHub secrets."
            exit 1
          fi
          HTTP_STATUS=$(curl -s -o /tmp/cf-verify.json -w "%{http_code}" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/user/tokens/verify")
          SUCCESS=$(python3 -c "import json; d=json.load(open('/tmp/cf-verify.json')); print(d.get('success', False))" 2>/dev/null || echo "false")
          if [ "$HTTP_STATUS" != "200" ] || [ "$SUCCESS" != "True" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is invalid or expired (HTTP $HTTP_STATUS, success=$SUCCESS)."
            exit 1
          fi
          echo " Cloudflare API token is valid."

      - name: 8. Deploy to Cloudflare Pages
        id: cloudflare_deploy
        working-directory: apps/frontend-blog
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          yarn exec opennextjs-cloudflare deploy -c wrangler.jsonc 2>&1 | tee /tmp/cloudflare-deploy.log

          CF_DEPLOYMENT_ID=$(grep -Eio 'deployment( id)?[: ]+[a-z0-9_-]+' /tmp/cloudflare-deploy.log \
            | tail -1 \
            | sed -E 's/.*[: ]+([a-z0-9_-]+)$/\1/I' || true)

          CF_VERSION_ID=$(grep -Eio 'version( id)?[: ]+[a-z0-9_-]+' /tmp/cloudflare-deploy.log \
            | tail -1 \
            | sed -E 's/.*[: ]+([a-z0-9_-]+)$/\1/I' || true)

          if [ -z "$CF_DEPLOYMENT_ID" ]; then
            CF_DEPLOYMENT_ID=""
          fi
          if [ -z "$CF_VERSION_ID" ]; then
            CF_VERSION_ID=""
          fi

          echo "cloudflare_deployment_id=$CF_DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"
          echo "cloudflare_version_id=$CF_VERSION_ID" >> "$GITHUB_OUTPUT"

      - name: 9. Create GitHub Deployment Record
        id: github_deploy
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ENV_NAME: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
        run: |
          set -euo pipefail

          BODY=$(cat <<JSON
          {
            "ref": "${{ github.sha }}",
            "environment": "${ENV_NAME}",
            "auto_merge": false,
            "required_contexts": [],
            "description": "Blog Cloudflare Pages deploy"
          }
          JSON
          )

          RESP=$(curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/deployments" \
            -d "$BODY")

          DEPLOYMENT_ID=$(echo "$RESP" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("id", ""))')
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "Failed to create GitHub deployment"
            echo "$RESP"
            exit 1
          fi
          echo "deployment_id=$DEPLOYMENT_ID" >> "$GITHUB_OUTPUT"

      - name: 10. Mark GitHub Deployment Success
        if: success() && steps.github_deploy.outputs.deployment_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYMENT_ID: ${{ steps.github_deploy.outputs.deployment_id }}
        run: |
          BLOG_URL="${{ github.ref_name == 'main' && 'https://blog.joyminis.com' || 'https://blog-dev.joyminis.com' }}"
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/deployments/$DEPLOYMENT_ID/statuses" \
            -d "{\"state\":\"success\",\"environment_url\":\"$BLOG_URL\",\"log_url\":\"https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" > /dev/null

      - name: 11. Smoke Check (optional)
        if: github.ref_name == 'main'
        run: |
          curl --fail --silent --show-error --location \
            --max-time 20 \
            "https://blog.joyminis.com" > /dev/null

      - name: 12. Publish Deployment Summary
        if: always()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## Cloudflare Blog Deployment

          - Environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
          - Commit: \`${{ github.sha }}\`
          - URL: ${{ github.ref_name == 'main' && 'https://blog.joyminis.com' || 'https://blog-dev.joyminis.com' }}
          EOF

      - name: 13. Send Telegram Notification
        if: always()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          STATUS_EMOJI=" Success"
          if [ "${{ job.status }}" != "success" ]; then
            STATUS_EMOJI="❌ Failed"
          fi

          if [ "${{ github.ref_name }}" = "main" ]; then
            BLOG_URL="https://blog.joyminis.com"
            BLOG_DOMAIN_LABEL="blog.joyminis.com"
          else
            BLOG_URL="https://blog-dev.joyminis.com"
            BLOG_DOMAIN_LABEL="blog-dev.joyminis.com"
          fi

          MESSAGE="☁️ *Blog Cloudflare Deployment Report*
          📌 *Status*: $STATUS_EMOJI
          🏷️ *Environment*: ${{ github.ref_name == 'main' && 'Production' || 'Preview' }} (Cloudflare Pages)
          🔗 *Blog URL*: [$BLOG_DOMAIN_LABEL]($BLOG_URL)
          📝 *Commit*: \`${{ github.sha }}\`"

          if [ -n "$TELEGRAM_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
              -d "chat_id=$TELEGRAM_CHAT_ID" \
              -d "text=$MESSAGE" \
              -d "parse_mode=Markdown" > /dev/null
          fi
