# ============================================================
# Swagger Docs Cloudflare Pages 部署流水线
# ============================================================
# 推送 main/test 分支且 API 相关文件变更时自动触发
# 流程: Checkout → 部署到 Cloudflare Pages
# 注意: Swagger spec 文件已在本地生成并提交到仓库，CI 仅负责部署
# ============================================================

name: Deploy Swagger Docs (Cloudflare Pages)

on:
  push:
    branches: [main, test]
    paths:
      - "apps/api/**"
      - "apps/swagger-docs/**"
      - ".github/workflows/deploy-swagger-docs.yml"
  workflow_dispatch:

concurrency:
  group: deploy-swagger-docs-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      # Step 1.5 / 步骤 1.5: Ensure the Cloudflare Pages project exists
      # cloudflare/pages-action@v1 requires the project to already exist
      # This step creates it via API if missing, so the deploy never fails with 404.
      - name: 1.5 Ensure Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT_NAME: "JoyMinis-Api-Platform"
        run: |
          set -euo pipefail

          echo "Checking if Pages project '$PROJECT_NAME' exists..."

          HTTP_STATUS=$(curl -s -o /tmp/cf-project-check.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT_NAME" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "✅ Project '$PROJECT_NAME' already exists."
          elif [ "$HTTP_STATUS" = "404" ]; then
            echo "📦 Project '$PROJECT_NAME' not found. Creating..."
            CREATE_RESP=$(curl -s -X POST \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{
                "name": "JoyMinis-Api-Platform",
                "production_branch": "main"
              }')
            CREATE_SUCCESS=$(echo "$CREATE_RESP" | python3 -c "import json,sys; print(json.load(sys.stdin).get('success', False))")
            if [ "$CREATE_SUCCESS" = "True" ]; then
              echo "✅ Project '$PROJECT_NAME' created successfully."
            else
              echo "::error::Failed to create Pages project."
              echo "$CREATE_RESP"
              exit 1
            fi
          else
            echo "::error::Unexpected API response status: $HTTP_STATUS"
            cat /tmp/cf-project-check.json
            exit 1
          fi

      - name: 2. Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: "JoyMinis-Api-Platform"
          directory: apps/swagger-docs
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: 3. Publish Deployment Summary
        if: always()
        run: |
          cat <<EOF >> "$GITHUB_STEP_SUMMARY"
          ## ☁️ Swagger Docs Cloudflare Deployment

          - Environment: ${{ github.ref_name == 'main' && 'production' || 'preview' }}
          - Commit: \`${{ github.sha }}\`
          - Endpoints: 293 (full API)
          EOF
