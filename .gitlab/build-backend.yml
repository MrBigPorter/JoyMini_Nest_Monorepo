# ============================================================
# 后端镜像构建流水线
# ============================================================

build-backend:
  stage: build
  image: docker:27-git
  services:
    - docker:27-dind
  tags:
    - saas-linux-large-amd64

  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "test"
      changes:
        - apps/api/**/*
        - packages/shared/**/*
        - packages/config/**/*
        - Dockerfile.prod
        - compose.prod.yml
        - nginx/nginx.prod.conf
        - nginx/whitelist.conf

  variables:
    DOCKER_BUILDKIT: 1
    REGISTRY: ghcr.io
    IMAGE_NAME: ghcr.io/mrbigporter/lucky-backend-prod

  before_script:
    - docker login ghcr.io -u "$CI_REGISTRY_USER" -p "$VPS_GHCR_PAT"

  script:
    - docker buildx create --use
    - docker buildx build --platform linux/amd64
      --tag "$IMAGE_NAME:latest"
      --tag "$IMAGE_NAME:$CI_COMMIT_SHORT_SHA"
      --file Dockerfile.prod
      --push
      .

  cache: []
