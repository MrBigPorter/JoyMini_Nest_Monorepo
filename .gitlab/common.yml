# ============================================================
# GitLab CI 公共配置
# ============================================================

default:
  image: node:20-bookworm
  interruptible: true
  timeout: 25 minutes
  tags:
    - saas-linux-large-amd64

# 同一分支新推送时自动取消旧CI运行
resource_group: ci/$CI_COMMIT_REF_SLUG

# 全局缓存
cache:
  # Yarn 全局包缓存 - 所有Job共享，只读，永远不会被覆盖
  - key:
      files:
        - yarn.lock
    paths:
      - .yarn/cache
      - .yarn/install-state.gz
    policy: pull

  # 每个Job独立 node_modules 缓存 - 每个Job每个分支独立，避免竞争损坏
  - key: "$CI_JOB_NAME-$CI_COMMIT_REF_SLUG"
    paths:
      - node_modules
      - apps/api/node_modules
      - apps/admin-next/node_modules
      - apps/frontend-blog/node_modules
      - apps/liveness-web/node_modules
      - packages/*/node_modules
    policy: pull-push
    when: on_success
