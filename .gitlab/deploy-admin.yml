# ============================================================
# Admin Cloudflare Workers 部署流水线
# ============================================================

deploy-admin:
  stage: deploy
  image: node:20-bookworm
  tags:
    - saas-linux-large-amd64

  rules:
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "test"
      changes:
        - apps/admin-next/**/*
        - packages/shared/**/*
        - packages/ui/**/*

  script:
    - git config core.autocrlf input
    - git config core.filemode false
    - corepack enable
    - corepack prepare yarn@4.9.2 --activate
    - yarn install --immutable

    - node packages/shared/scripts/build.js
    - node packages/ui/scripts/build.js

    - DEPLOYED_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
    - GIT_SHA=$CI_COMMIT_SHA

    - cd apps/admin-next
    - NODE_ENV=production \
      NEXT_PUBLIC_API_BASE_URL=$NEXT_PUBLIC_API_BASE_URL \
      NEXT_PUBLIC_WS_URL=$NEXT_PUBLIC_WS_URL \
      NEXT_PUBLIC_RECAPTCHA_SITE_KEY=$NEXT_PUBLIC_RECAPTCHA_SITE_KEY \
      NEXT_PUBLIC_SENTRY_DSN=$NEXT_PUBLIC_SENTRY_DSN \
      NEXT_PUBLIC_APP_ENV=$([ "$CI_COMMIT_BRANCH" = "main" ] && echo "production" || echo "preview") \
      NEXT_PUBLIC_SENTRY_DEBUG=$([ "$CI_COMMIT_BRANCH" = "test" ] && echo "true" || echo "false") \
      NEXT_PUBLIC_DEPLOYED_AT=$DEPLOYED_AT \
      NEXT_PUBLIC_GIT_SHA=$GIT_SHA \
      yarn exec opennextjs-cloudflare build

    # 验证 Cloudflare 凭证
    - |
      set -euo pipefail
      if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
        echo "❌ CLOUDFLARE_API_TOKEN is not set"
        exit 1
      fi

      HTTP_STATUS=$(curl -s -o /tmp/cf-verify.json -w "%{http_code}" \
        -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
        "https://api.cloudflare.com/client/v4/user/tokens/verify")
      SUCCESS=$(python3 -c "import json; d=json.load(open('/tmp/cf-verify.json')); print(d.get('success', False))" 2>/dev/null || echo "false")
      if [ "$HTTP_STATUS" != "200" ] || [ "$SUCCESS" != "True" ]; then
        echo "❌ CLOUDFLARE_API_TOKEN is invalid or expired"
        exit 1
      fi
      echo "✅ Cloudflare API token is valid."

    # 部署
    - CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID yarn exec opennextjs-cloudflare deploy -c wrangler.jsonc

  after_script:
    # Telegram 通知
    - |
      if [ "$CI_JOB_STATUS" = "success" ]; then
        STATUS_EMOJI="✅ Success"
      else
        STATUS_EMOJI="❌ Failed"
      fi

      if [ "$CI_COMMIT_BRANCH" = "main" ]; then
        ADMIN_URL="https://admin.joyminis.com"
        ADMIN_DOMAIN_LABEL="admin.joyminis.com"
      else
        ADMIN_URL="https://admin-dev.joyminis.com"
        ADMIN_DOMAIN_LABEL="admin-dev.joyminis.com"
      fi

      MESSAGE="☁️ *Admin Next Cloudflare Deployment Report*
      📌 *Status*: $STATUS_EMOJI
      🏷️ *Environment*: $([ "$CI_COMMIT_BRANCH" = "main" ] && echo "Production" || echo "Preview") (Cloudflare Workers)
      🔗 *Admin URL*: [$ADMIN_DOMAIN_LABEL]($ADMIN_URL)
      📝 *Commit*: \`$CI_COMMIT_SHORT_SHA\`"

      curl -s -X POST "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage" \
        -d "chat_id=$TELEGRAM_CHAT_ID" \
        -d "text=$MESSAGE" \
        -d "parse_mode=Markdown" > /dev/null

  resource_group: deploy-admin
  interruptible: false
