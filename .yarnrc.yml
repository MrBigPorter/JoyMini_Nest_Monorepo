approvedGitRepositories:
  - "**"

compressionLevel: 0

enableGlobalCache: false

enableImmutableCache: false

enableScripts: true

httpTimeout: 30000

logFilters:
  - code: YN0060
    level: discard
  - code: YN0002
    level: discard
  - code: YN0007
    level: discard
  - code: YN0008
    level: discard
  - code: YN0009
    level: discard

networkConcurrency: 2

nodeLinker: node-modules

supportedArchitectures:
  cpu:
    - x64
    - arm64
  libc:
    - glibc
    - musl
  os:
    - linux
    - darwin

unsafeHttpWhitelist:
  - "*"

yarnPath: .yarn/releases/yarn-4.14.1.cjs
