<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.7" />
      <stop offset="100%" style="stop-color:#1e40af;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="800" height="450" fill="url(#gradient)" />
  
  <!-- 中心图标 -->
  <g transform="translate(400, 225)">
    <circle cx="0" cy="0" r="80" fill="white" fill-opacity="0.2" />
    
    <!-- 书本图标 -->
    <g transform="translate(0, 0)" fill="white" fill-opacity="0.8">
      <rect x="-40" y="-30" width="80" height="60" rx="4" />
      <rect x="-35" y="-25" width="70" height="50" fill="white" fill-opacity="0.3" />
      <line x1="-20" y1="-25" x2="-20" y2="25" stroke="white" stroke-width="2" stroke-opacity="0.6" />
      <line x1="0" y1="-25" x2="0" y2="25" stroke="white" stroke-width="2" stroke-opacity="0.6" />
      <line x1="20" y1="-25" x2="20" y2="25" stroke="white" stroke-width="2" stroke-opacity="0.6" />
    </g>
    
    <!-- 文字 -->
    <text x="0" y="120" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="24" font-weight="bold" opacity="0.9">
      Tarsier Labs
    </text>
    <text x="0" y="150" text-anchor="middle" fill="white" font-family="Arial, sans-serif" font-size="16" opacity="0.7">
      Article Preview
    </text>
  </g>
  
  <!-- 装饰性元素 -->
  <circle cx="100" cy="100" r="30" fill="white" fill-opacity="0.1" />
  <circle cx="700" cy="350" r="40" fill="white" fill-opacity="0.1" />
  <circle cx="200" cy="380" r="25" fill="white" fill-opacity="0.1" />
</svg>