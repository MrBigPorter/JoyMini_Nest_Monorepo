              properties:
                phone:
                  type: string
                  example: "9878129723"
              required:
                - phone
      responses:
        "10000":
          description: success
          content:
            application/json:
              schema:
                example:
                  code: 999999
                  message: success
                  tid: ...
                  data: null
      summary: request OTP
      tags: &a5
        - otp
