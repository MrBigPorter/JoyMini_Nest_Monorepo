          items:
            $ref: "#/components/schemas/BatchImportItem"
        defaultStatus:
          type: string
          description: 默认文章状态
          enum: *a81
          default: DRAFT
        overwrite:
          type: boolean
          description: 是否覆盖已存在的文章（同 slug）
          default: false
      required:
        - articles
    UpdateArticleDto:
      type: object
      properties:
        title:
          type: object
          description: 文章标题 (多语言)
          example: *a82
        content:
          type: object
          description: 文章内容 (多语言)
        excerpt:
          type: object
          description: 文章摘要 (多语言)
        featuredImage:
          type: object
          description: 特色图片 URL (featuredImage) - 支持字符串或多语言对象
        status:
          type: string
          description: 文章状态
          enum: *a83
          default: DRAFT
        categoryId:
          type: string
          description: 分类 ID
        tagIds:
          description: 标签 ID 列表
          type: array
          items:
            type: string
        featured:
          type: boolean
          description: 是否精选文章（首页展示）
          default: false
        meta:
          type: object
          description: 文章元数据（图片变体、视频信息等）
          example: *a84
    TriggerVideoTranscodeDto:
      type: object
      properties:
        videoKey:
          type: string
          description: R2 key of the video file (e.g., videos/uuid.MP4)
      required:
        - videoKey
    CreateCommentDto:
      type: object
      properties:
        content:
          type: string
          description: Comment content
          minLength: 1
          maxLength: 2000
        parentId:
          type: string
          description: Parent comment ID for replies
        author:
          type: string
          description: Author nickname (required for anonymous comments)
        email:
          type: string
          description: Author email (optional for anonymous comments)
        website:
          type: string
          description: Author website (optional for anonymous comments)
      required:
        - content
