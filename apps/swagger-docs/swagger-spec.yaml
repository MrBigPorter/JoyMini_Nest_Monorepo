info:
  title: JoyMini API — NestJS Backend Platform
  description: REST API for web/mobile (Full endpoints including admin)
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    UploadFolderDto:
      type: object
      properties:
        folder:
          type: string
          description: Upload folder
          enum:
            - kyc
            - general
            - avatar
            - document
            - other
            - images
            - videos
            - treasure
        articleId:
          type: string
          description: Article ID for media processing (optional, blog only)
    GeneratePresignedUrlDto:
      type: object
      properties:
        fileName:
          type: string
          description: Original file name (e.g. video.mp4)
        fileType:
          type: string
          description: MIME type (e.g. video/mp4)
      required:
        - fileName
        - fileType
    ConfirmUploadDto:
      type: object
      properties:
        key:
          type: string
          description: R2 object key returned from presigned-url endpoint
        originalName:
          type: string
          description: Original file name
        articleId:
          type: string
          description: Article ID for media processing (optional)
        mimeType:
          type: string
          description: MIME type (used for isVideo detection fallback)
        mediaUsage:
          type: string
          description: 'Optional media usage hint (blog): "cover" (coverImage) or
            "content" (rich-text). Used to route transcoding results to
            meta.video vs meta.contentVideo.'
      required:
        - key
        - originalName
    LoginOtpDto:
      type: object
      properties:
        phone:
          type: string
          example: "9878129723"
          description: phone number
        countryCode:
          type: number
          example: 1
          description: country code
        inviteCode:
          type: number
          example: "123456"
          description: OTP code
      required:
        - phone
        - inviteCode
    TokenResponseDto:
      type: object
      properties:
        accessToken:
          type: string
          description: Access Token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refreshToken:
          type: string
          description: Refresh Token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
      required:
        - accessToken
        - refreshToken
    LoginResultResponseDto:
      type: object
      properties:
        id:
          type: string
          example: cmippru8j0000pic3giq0fgc4
        phone:
          type: string
          example: "+639171234567"
        phoneMd5:
          type: string
          example: e10adc3949ba59abbe56e057f20f883e
        nickname:
          type: string
          example: Porter
        avatar:
          type: object
          example: https://cdn.xxx.com/avatar/1.png
          nullable: true
        inviteCode:
          type: string
          example: ABCD12
        vipLevel:
          type: number
          example: 0
          description: VIP level (0=normal)
        kycStatus:
          type: number
          example: 1
          description: KYC status (0=Pending,1=Review,2=Approved,3=Rejected)
        lastLoginAt:
          type: object
          description: Last login timestamp (ms)
          nullable: true
        selfExclusionExpireAt:
          type: object
          example: "199009999"
          nullable: true
          description: Self-exclusion expiry date
        tokens:
          $ref: "#/components/schemas/TokenResponseDto"
      required:
        - id
        - phone
        - phoneMd5
        - nickname
        - inviteCode
        - vipLevel
        - kycStatus
        - lastLoginAt
        - selfExclusionExpireAt
        - tokens
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
