# Cloudflare Tunnel Configuration for JoyMini Nest Monorepo
# This file configures a single tunnel to expose all local development services
# 
# Usage:
# 1. Install cloudflared: brew install cloudflare/cloudflare/cloudflared
# 2. Login: cloudflared tunnel login
# 3. Create tunnel: cloudflared tunnel create lucky-nest-monorepo
# 4. Update tunnel ID below
# 5. Run: cloudflared tunnel --config cloudflared.yml run lucky-nest-monorepo

tunnel: bd7bd901-8cc2-4d6c-bba6-7f98eddfce5e
credentials-file: ~/.cloudflared/bd7bd901-8cc2-4d6c-bba6-7f98eddfce5e.json

ingress:
  # Blog Frontend → Docker Nginx (routes by Host header)
  - hostname: blog-dev.joyminis.com
    service: http://localhost:80

  # Blog Admin Frontend → Docker Nginx
  - hostname: blog-admin-dev.joyminis.com
    service: http://localhost:80

  # Admin Frontend → Docker Nginx
  - hostname: admin-dev.joyminis.com
    service: http://localhost:80

  # API Service → Docker Nginx (handles /api/* paths)
  - hostname: dev-api.joyminis.com
    service: http://localhost:80

  # Liveness Service → Docker Nginx
  - hostname: liveness-dev.joyminis.com
    service: http://localhost:80

  # CodePush Server — 热更新服务 (直连容器端口，不需要 Nginx)
  - hostname: codepush.joyminis.com
    service: http://localhost:3000

  # Fallback rule - return 404 for unmatched requests
  - service: http_status:404