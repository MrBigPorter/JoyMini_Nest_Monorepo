# ==========================================
# Standalone Ollama Service (shared across projects)
# ==========================================
# This is an OPTIONAL service — the project works without Ollama
# (AiService auto-falls back to DeepSeek → Groq → Gemini)
#
# Usage:
#   Start: docker compose -f compose.ollama.yml up -d
#   Stop:  docker compose -f compose.ollama.yml down
#   Logs:  docker compose -f compose.ollama.yml logs -f
#
# For local dev on macOS, brew is simpler:
#   brew install ollama && brew services start ollama
# ==========================================

services:
  # =========================================
  # Ollama local model service
  # =========================================
  ollama:
    image: ollama/ollama:latest
    container_name: joymini-ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:11434/api/tags']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # =========================================
  # Model initialization (pulls models on first start)
  # =========================================
  ollama-init:
    image: ollama/ollama:latest
    container_name: joymini-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo '>>> Pulling LLM model: qwen3.5:0.8b ...' &&
        ollama pull qwen3.5:0.8b &&
        echo '>>> Pulling Embedding model: mxbai-embed-large ...' &&
        ollama pull mxbai-embed-large &&
        echo '>>> All models ready!'
      "
    restart: 'no'

volumes:
  ollama_data:
