# ==========================================
# Standalone Ollama Embedding Service (bge-m3 only)
# ==========================================
# 仅提供本地 Embedding 服务（bge-m3 → 1024d 向量）
# 文本生成仍使用 online DeepSeek API，不需要本地 LLM 模型
#
# Usage:
#   Start: docker compose -f compose.ollama.yml up -d
#   Stop:  docker compose -f compose.ollama.yml down
#   Logs:  docker compose -f compose.ollama.yml logs -f
# ==========================================

services:
  # =========================================
  # Ollama Embedding service
  # =========================================
  ollama:
    image: ollama/ollama:latest
    container_name: joymini-ollama
    ports:
      - '11434:11434'
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:11434/api/tags']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks: [app]

  # =========================================
  # Model initialization (pulls bge-m3 on first start)
  # =========================================
  ollama-init:
    image: ollama/ollama:latest
    container_name: joymini-ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: >
      sh -c "
        echo '>>> Pulling Embedding model: bge-m3 ...' &&
        ollama pull bge-m3 &&
        echo '>>> bge-m3 ready!'
      "
    restart: 'no'
    networks: [app]

networks:
  app:
    external: true
    name: joymini_app

volumes:
  ollama_data:
