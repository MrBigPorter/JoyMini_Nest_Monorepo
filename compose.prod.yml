# ==========================================
# 生产环境 Docker Compose (8GB VPS)
# ==========================================
# 本地构建 + 部署: ./deploy/deploy.sh
# 仅重启:         ./deploy/deploy.sh --quick
# 停止: docker compose -f compose.prod.yml down
# 日志: docker compose -f compose.prod.yml logs -f
# ==========================================
# 内存预算 (8GB 服务器):
#   OS + Docker: ~500 MB
#   Backend:     ≤2 GB  (Node.js 1.5GB + ffmpeg 512MB)
#   PostgreSQL:  ≤2 GB
#   Redis:       ≤512 MB (maxmemory 400MB)
#   Nginx:       ≤64 MB
#   Infinity:    ≤3 GB  (bge-m3 embedding 模型)
#   Swap 兜底:   2 GB
#   总计:        ~7.6 GB 容器 + 2 GB swap，刚刚够用
# ==========================================

services:
  # =========================================
  # 后端 API (生产模式)
  # =========================================
  # 镜像来源:
  #   - CI 部署: GHCR 拉取 (ghcr.io/mrbigporter/lucky-backend-prod:latest)
  #   - 本地部署: deploy.sh 本地构建 (lucky-backend-prod:latest)
  # 通过 BACKEND_IMAGE 环境变量切换, 默认本地镜像
  # =========================================
  backend:
    image: ${BACKEND_IMAGE:-lucky-backend-prod:latest}
    container_name: lucky-backend-prod
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - deploy/.env.prod
    environment:
      # 限制 Node.js 堆内存 (防 OOM) — 配合 2G 容器限制，留 ~512MB 给 ffmpeg 视频转码
      - NODE_OPTIONS=--max-old-space-size=1536
      # 迁移默认自动执行（entrypoint.sh）；若需跳过设 SKIP_MIGRATIONS=true
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:3000/api/v1/health >/dev/null 2>&1 || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app]


  # =========================================
  # Nginx 反向代理 + API 网关
  # =========================================
  nginx:
    image: nginx:latest
    container_name: lucky-nginx-prod
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 64M
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 挂载 conf.d/ 目录，nginx 自动加载所有 .conf 文件（whitelist.conf 已含在内）
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # SSL 证书（自签名，用于 Cloudflare Full 模式 SSL 终止）
      - ./certs:/etc/nginx/certs:ro
      # 静态文件（.well-known 等）
      - ./nginx/html:/var/www/html:ro
      - nginx_cache:/var/cache/nginx
    extra_hosts:
      # 允许通过 host.docker.internal 访问其他 compose 栈的容器
      - "host.docker.internal:host-gateway"
    depends_on:
      # 仅控制启动顺序，backend 挂了 nginx 仍可独立运行（返回 502 而非 521）
      - backend
    networks: [app]

  # =========================================
  # Redis
  # =========================================
  redis:
    image: redis:7-alpine
    container_name: lucky-redis-prod
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    command: redis-server /etc/redis/redis.conf --requirepass "${REDIS_PASSWORD:-changeme}"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    env_file:
      - deploy/.env.prod
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a ${REDIS_PASSWORD:-changeme} ping | grep PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app]

  # =========================================
  # PostgreSQL
  # =========================================
  db:
    image: pgvector/pgvector:pg16
    container_name: lucky-db-prod
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 256M
    # 优化 PG 内存使用 (8GB 服务器)
    command: >
      postgres
        -c shared_buffers=256MB
        -c work_mem=16MB
        -c maintenance_work_mem=256MB
        -c effective_cache_size=1GB
        -c max_connections=100
    env_file:
      - deploy/.env.prod
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app]

  # =========================================
  # Frontend Blog (Next.js SSR — tarsierlabs.app)
  # =========================================
  # 说明:
  #   - 从 Cloudflare Workers 迁移至 VPS Docker，解决 Workers Free 10ms CPU 限制
  #   - 通过 Cloudflare CDN (orange cloud) 对外服务，静态资源缓存到 330+ 边缘节点
  #   - Docker 内部 nginx 反向代理，运行时 DNS 解析 (127.0.0.11)
  #   - 内存预算: 512MB limit / 128MB reservation
  # =========================================
  frontend-blog:
    image: ${FRONTEND_BLOG_IMAGE:-lucky-frontend-blog-prod:latest}
    container_name: lucky-frontend-blog-prod
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_PUBLIC_SITE_URL=https://tarsierlabs.app
      - NEXT_PUBLIC_API_BASE_URL=/api
      - INTERNAL_API_URL=http://backend:3000/api
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    networks: [app]

  # =========================================
  # Ollama 本地 LLM 服务（可选 — 生产环境）
  # =========================================
  # Ollama 是可选依赖，AiService 会自动降级到 DeepSeek/Groq/Gemini
  #
  # 生产环境建议在宿主机直接安装 Ollama（避免 Docker 额外开销）：
  #   curl -fsSL https://ollama.com/install.sh | sh
  #
  # 取消注释以启用 Docker 方式：
  #
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: joymini-ollama-prod
  #   restart: unless-stopped
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 4G
  #       reservations:
  #         memory: 1G
  #   volumes:
  #     - ollama_data:/root/.ollama
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 120s
  #   networks: [app]

  # =========================================
  # Infinity Embedding 引擎 (bge-m3)
  # =========================================
  # 高性能本地 embedding 服务，替代 Jina AI 线上 embedding。
  # 首次启动自动下载 BAAI/bge-m3 模型（~2.2G）。
  # Reranker 继续走 Jina AI 线上 API（JinaProvider），
  # Infinity 只做 embedding = 仅需加载 bge-m3 一个模型。
  #
  # 不对外暴露端口，通过 nginx 路由 /infinity/ → proxy_pass 访问。
  # =========================================
  infinity:
    image: michaelf34/infinity:latest
    container_name: joymini-infinity
    command: >
      v2 --model-id BAAI/bge-m3
    volumes:
      - infinity_hf_cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7997/health"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 480s
    restart: unless-stopped
    networks: [app]
    deploy:
      resources:
        limits:
          memory: 3G
        reservations:
          memory: 1G

networks:
  app:

volumes:
  db_data:
  redis_data:
  ollama_data:
  nginx_cache:
  infinity_hf_cache:
