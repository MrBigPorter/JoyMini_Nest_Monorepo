  #     - ollama_data:/root/.ollama
  #   healthcheck:
  #     test: ["CMD-SHELL", "ollama list 2>/dev/null || exit 1"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 120s
  #   restart: unless-stopped
  #   networks: [app]

  # =========================================
  # ⏸️ Infinity Rerank 服务（已迁移到 Jina AI 线上 API）
  # 如需切回本地 Infinity，取消下方全部注释（共 15 行）
  # =========================================
  # infinity:
  #   image: michaelf34/infinity:latest
  #   container_name: joymini-infinity
  #   command: >
  #     v2 --model-id BAAI/bge-reranker-v2-m3 --model-id BAAI/bge-m3
  #   environment:
  #     - HF_ENDPOINT=https://hf-mirror.com
  #   ports:
  #     - "7997:7997"
  #   volumes:
  #     - infinity_hf_cache:/root/.cache/huggingface
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:7997/health"]
  #     interval: 30s
  #     timeout: 10s
  #     retries: 20
  #     start_period: 480s
  #   restart: unless-stopped
  #   networks: [app]

  # =========================================
  # Unstructured PDF 解析（手动启停，不上传文档时不开）
  # =========================================
  # 仅在需要解析 PDF 时启动：
  #   docker compose up -d unstructured
  # 用完关闭：
  #   docker compose stop unstructured
  #
  # 首次启动需要下载模型（~2-5分钟）
  # 支持: OCR、表格提取、多栏排版、Markdown 输出
  # =========================================
  unstructured:
    image: downloads.unstructured.io/unstructured-io/unstructured-api:latest
    container_name: joymini-unstructured
    ports:
      - "8000:8000"
    command: ["--port", "8000", "--workers", "2"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    restart: "no"
    networks: [app]

  # =========================================
  # Meilisearch (BM25 关键词搜索, Rust 实现)
  # =========================================
  # 轻量级全文搜索引擎，替代 Elasticsearch。
  # - 内存: ~100-256MB（ES ~1.5-2GB）
  # - 镜像: ~50MB（ES ~1.3GB）
  # - 启动: <5s（ES ~30-60s JVM 预热）
  # - 内置中文分词 + BM25 变体
  # =========================================
  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: joymini-meilisearch
    ports:
      - "7700:7700"
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_MASTER_KEY:-dev-master-key}
      - MEILI_NO_ANALYTICS=true
      - MEILI_ENV=development
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health | grep -q 'status.*available' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [app]

networks:
  app:

volumes:
  db_data:
  redis_data:
  ollama_data:
  meili_data:
  backend_nm:
  admin_next_nm:
  admin_next_data:
  admin_blog_nm:
  blog_next_nm:
  pkg_shared_nm:
  pkg_ui_nm:
  pkg_eslint_nm:
  pkg_tsconfig_nm:
  pkg_config_nm:
  # infinity_hf_cache:  # 已迁移到 Jina AI，切回时取消注释
