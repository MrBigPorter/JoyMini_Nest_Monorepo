  # =========================================
  # Admin Blog (开发模式 — Next.js)
  # =========================================
  admin-blog:
    build:
      context: .
      dockerfile: apps/admin-next/Dockerfile.dev
    container_name: lucky-admin-blog-dev
    command: >
      sh -c "corepack enable &&
             export PATH=/app/node_modules/.bin:$$PATH &&
             LOCK_HASH=$$(md5sum /app/yarn.lock | cut -d' ' -f1) &&
             CACHE=/app/node_modules/.admin-blog-install-hash &&
             if [ ! -f \"$$CACHE\" ] || [ \"$$(cat $$CACHE 2>/dev/null)\" != \"$$LOCK_HASH\" ] || ! command -v next >/dev/null 2>&1; then
               echo '>>> dependency check triggered - running install...' &&
               yarn workspaces focus @lucky/admin-blog &&
               echo \"$$LOCK_HASH\" > \"$$CACHE\";
             else
               echo '>>> yarn.lock unchanged - skipping install';
             fi &&
             yarn workspace @lucky/admin-blog dev"
    expose:
      - "4002"
    volumes:
      - .:/app
      - admin_blog_nm:/app/node_modules
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      INTERNAL_API_URL: http://lucky-backend-dev:3000/api
      NEXT_PUBLIC_APP_ENV: development
      HOSTNAME: "0.0.0.0"
      AUTH_COOKIE_DOMAIN: .joyminis.com
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:4002/'', r => process.exit(r.statusCode < 500 ? 0 : 1)).on(''error'', () => process.exit(1))"',
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    depends_on:
      shared-packages-builder:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks: [app]

  # =========================================
  # Blog 前端 (开发模式 — Next.js)
  # =========================================
  frontend-blog:
    build:
      context: .
      dockerfile: apps/admin-next/Dockerfile.dev
    container_name: lucky-frontend-blog-dev
    command: >
      sh -c "corepack enable &&
             export PATH=/app/node_modules/.bin:$$PATH &&
             LOCK_HASH=$$(md5sum /app/yarn.lock | cut -d' ' -f1) &&
             CACHE=/app/node_modules/.blog-install-hash &&
             if [ ! -f \"$$CACHE\" ] || [ \"$$(cat $$CACHE 2>/dev/null)\" != \"$$LOCK_HASH\" ] || ! command -v next >/dev/null 2>&1; then
               echo '>>> dependency check triggered - running install...' &&
               yarn workspaces focus @lucky/frontend-blog &&
               echo '>>> Removing duplicate React in workspace to prevent dual-instance HMR crashes...' &&
               rm -rf apps/frontend-blog/node_modules/react apps/frontend-blog/node_modules/react-dom &&
               echo \"$$LOCK_HASH\" > \"$$CACHE\";
             else
               echo '>>> yarn.lock unchanged - skipping install';
             fi &&
             cd apps/frontend-blog && PORT=4002 next dev --turbopack -p 4002"
    expose:
      - "4002"
    volumes:
      - .:/app
      - blog_next_nm:/app/node_modules
    environment:
      NEXT_PUBLIC_API_BASE_URL: /api
      INTERNAL_API_URL: http://lucky-backend-dev:3000/api
      NEXT_PUBLIC_APP_ENV: development
      HOSTNAME: "0.0.0.0"
      PORT: "4002"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''http'').get(''http://localhost:4002/'', r => process.exit(r.statusCode < 500 ? 0 : 1)).on(''error'', () => process.exit(1))"',
        ]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 120s
    depends_on:
      shared-packages-builder:
        condition: service_completed_successfully
      backend:
        condition: service_started
    networks: [app]

  # =========================================
  # Nginx 反向代理
  # =========================================
  nginx:
    image: nginx:latest
    container_name: lucky-nginx-dev
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf
      - ./nginx/whitelist.conf:/etc/nginx/conf.d/whitelist.conf
      - ./certs:/etc/nginx/certs
      - ./nginx/html:/var/www/html
    depends_on:
      backend:
        condition: service_started
    networks: [app]

  # =========================================
  # Redis
  # =========================================
  redis:
    image: redis:7
    container_name: lucky-redis
    command: redis-server /etc/redis/redis.conf --requirepass "${REDIS_PASSWORD:-devpassword}"
    env_file:
      - deploy/.env.dev
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/etc/redis/redis.conf
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a ${REDIS_PASSWORD:-devpassword} ping | grep PONG",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app]

  # =========================================
  # PostgreSQL
  # =========================================
  db:
    image: pgvector/pgvector:pg16
    container_name: lucky-db
    env_file:
      - deploy/.env.dev
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app]

  # =========================================
  # Ollama Embedding 服务（已废弃，由 Infinity 替代）
  # =========================================
  # 之前用于本地 Embedding（bge-m3），现在由 Infinity 统一处理
  # ollama 服务已注释，如需恢复执行：
  #   docker compose up -d ollama
