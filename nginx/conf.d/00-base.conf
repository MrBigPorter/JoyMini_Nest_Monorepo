# ==========================================
# 全局基础配置 — 被所有 server block 共享
# ==========================================
# 此文件包含 http 级别的全局指令：
#   - Gzip 压缩
#   - 限流 zone
#   - 代理缓存
#   - 预检请求映射
#   - Docker DNS 解析器
# ==========================================

# Gzip 压缩
gzip on;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_vary on;
gzip_proxied any;
gzip_types
    application/json
    application/javascript
    application/xml
    text/plain
    text/css
    text/javascript
    image/svg+xml;

# 预检请求分流
map $request_method $is_options {
    default 0;
    OPTIONS 1;
}

# 通用 API 限流 (每秒 50 请求 / IP，突发 100) — 8核服务器放宽
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

# 公开博客 API 限流 (每秒 30 请求 / IP，突发 60) — 防止爬虫，同时允许正常页面并发
limit_req_zone $binary_remote_addr zone=blog_public_limit:10m rate=30r/s;

# 代理缓存 — 公开 GET 响应缓存 1 分钟，减少后端压力
proxy_cache_path /var/cache/nginx/public_api levels=1:2 keys_zone=public_cache:10m max_size=2g inactive=60m use_temp_path=off;

# Docker DNS 解析器（运行时动态解析容器名，防止容器重建后 502）
resolver 127.0.0.11 valid=10s ipv6=off;

# SSO Auth 诊断日志格式
log_format auth '$remote_addr [$time_local] "$request" $status '
                'args="$args" arg_token="$arg_token" '
                'request_uri="$request_uri"';
