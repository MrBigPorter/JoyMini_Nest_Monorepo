# ==========================================
# API 网关 — api.joyminis.com
# ==========================================
# 特点：
#   - 专属 API 域名
#   - Swagger 文档禁止外部访问
#   - 生产级安全头
#   - 限流保护
#   - Cloudflare Flexible SSL 卸载（仅 HTTP）
# ==========================================

server {
    listen 80;
    server_name api.joyminis.com;

    # 使用变量强制运行时 DNS 解析，而非 worker 启动时缓存
    set $backend_upstream http://backend:3000;

    access_log /dev/stdout combined;
    error_log  /dev/stderr warn;

    client_max_body_size 500M;

    # ---- 安全头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cloudflare 已终止 SSL，告知后端请求来自 HTTPS
    proxy_set_header X-Forwarded-Proto https;

    # ========================================================
    #  0. 安全探针拦截（bot/scanner 扫描，444 静默丢弃）
    # ========================================================
    location ~* /(\.env|\.git|\.htaccess|\.htpasswd|backup\.sql|dump\.sql|phpinfo\.php|wp-login\.php|wp-admin|\.DS_Store) {
        access_log off;
        return 444;
    }

    # ========================================================
    #  A. 静态文件 & 特殊业务
    # ========================================================

    location = /share.html {
        rewrite ^ /api/v1/share.html break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /.well-known/ {
        root /var/www/html;

        try_files $uri $uri/ =404;

        # JSON 文件 Content-Type
        if ($uri ~* "\.json$") {
            add_header Content-Type application/json always;
        }
        if ($uri ~* "apple-app-site-association$") {
            add_header Content-Type application/json always;
        }

        # CORS 头（Android/iOS 系统需要）
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;

        add_header Cache-Control "public, max-age=3600";
    }

    # ========================================================
    #  B. 支付 Webhook (不限流)
    # ========================================================
    location ~ ^/api/(v1/)?payment/webhook/xendit {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ========================================================
    #  C.0 SSE 流式端点
    # ========================================================
    location ~ ^/api/v1/(frontend/blog|client/system-config).*/stream$ {
        limit_req zone=blog_public_limit burst=20 nodelay;

        proxy_cache off;
        proxy_buffering off;

        # CORS
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,x-lang,x-csrf-token,x-xsrf-token,x-skip-auth-refresh,signature_nonce,currentTime,lang,x-device-id,x-device-model,x-platform" always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Content-Length 0 always;
            return 204;
        }

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 600s;

        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
    }

    # ========================================================
    #  C.1 公开博客 API — 严格限流 + 代理缓存
    # ========================================================
    location ~ ^/api/v1/(frontend/blog|client/system-config) {
        limit_req zone=blog_public_limit burst=20 nodelay;

        proxy_cache public_cache;
        proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_origin";
        proxy_cache_valid 200 301 302 304 60s;
        add_header Vary "Origin, Accept-Encoding" always;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        add_header X-Cache-Status $upstream_cache_status;

        # CORS
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,x-lang,x-csrf-token,x-xsrf-token,x-skip-auth-refresh,signature_nonce,currentTime,lang,x-device-id,x-device-model,x-platform" always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Content-Length 0 always;
            return 204;
        }

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ========================================================
    #  D. 核心 API (通用)
    # ========================================================

    # 调账白名单
    location = /api/v1/admin/finance/adjust {
        include /etc/nginx/conf.d/whitelist.conf;
        deny all;

        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Swagger 仅允许白名单访问
    location ~ ^/(docs|swagger-ui|api-json) {
        include /etc/nginx/conf.d/whitelist.conf;
        deny all;

        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 通用 API
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        # CORS
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,x-lang,x-csrf-token,x-xsrf-token,x-skip-auth-refresh,signature_nonce,currentTime,lang,x-device-id,x-device-model,x-platform" always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Content-Length 0 always;
            return 204;
        }

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ========================================================
    #  D.1 OAuth 授权路由 (/auth/) - 代理到后端 API
    # ========================================================
    location ^~ /auth/ {
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        if ($is_options) {
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers '*' always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }

        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Headers '*' always;

        rewrite ^/auth/(.*) /api/v1/auth/$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Original-URI $request_uri;
    }

    # ========================================================
    #  E. WebSocket / Socket.IO
    # ========================================================
    location ^~ /socket.io/ {
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
