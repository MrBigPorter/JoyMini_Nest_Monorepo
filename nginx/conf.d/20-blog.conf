# ==========================================
# Frontend Blog — tarsierlabs.app / tarsier.joyminis.com
# ==========================================
# Next.js SSR via Docker (frontend-blog:3000)
# API 同域代理到 backend:3000
# Cloudflare Full SSL 终止（443 HTTPS + 80→301 跳转）
# ==========================================

server {
    listen 443 ssl;
    http2 on;
    server_name tarsier.joyminis.com tarsierlabs.app;

    # ---- SSL（自签名证书，Cloudflare Full 模式使用）----
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 10m;

    # 上游地址（使用变量强制运行时 DNS 解析）
    set $frontend_blog_upstream http://frontend-blog:3000;
    set $backend_upstream http://backend:3000;

    access_log /dev/stdout combined;
    error_log  /dev/stderr warn;

    client_max_body_size 100M;

    # ---- 安全头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cloudflare 已终止 SSL
    proxy_set_header X-Forwarded-Proto https;

    # ---- API Proxy (same-origin) ----
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ---- Auth Proxy (same-origin) ----
    location /auth/ {
        rewrite ^/auth/(.*) /api/v1/auth/$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # ---- 静态资源 (长期缓存, content-hash) ----
    location /_next/static/ {
        proxy_pass $frontend_blog_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location /favicon.ico {
        proxy_pass $frontend_blog_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        add_header Cache-Control "public, max-age=86400" always;
    }

    # ---- 动态页面 (不缓存 HTML, 由 Next.js ISR 控制) ----
    location / {
        proxy_pass $frontend_blog_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        add_header Cache-Control "public, max-age=0, must-revalidate" always;
    }
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name tarsier.joyminis.com tarsierlabs.app;
    return 301 https://$host$request_uri;
}
