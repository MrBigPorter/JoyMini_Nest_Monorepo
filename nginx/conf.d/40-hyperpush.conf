# ==========================================
# HyperPush — hyperpush.org
# ==========================================
# 管理后台 SPA + GraphQL API
# 通过 host.docker.internal 访问 HyperPush 容器的宿主端口
# 由 HyperPush 项目维护
# ==========================================

server {
    listen 443 ssl;
    http2 on;
    server_name hyperpush.org;

    # ---- SSL（自签名证书，Cloudflare Full 模式使用）----
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 10m;

    access_log /dev/stdout combined;
    error_log  /dev/stderr warn;

    client_max_body_size 100M;

    # ---- 安全头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header X-Forwarded-Proto https;

    # ---- CodePush 下载路径 ----
    # 代理到 code-push-server (host 3003 端口)
    # 注意 proxy_pass 末尾的 / 会剥离 /codepush 前缀
    location /codepush/ {
        proxy_pass http://host.docker.internal:3003/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
    }

    # ---- GraphQL API (NestJS BFF) ----
    location /graphql {
        proxy_pass http://host.docker.internal:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ---- API 路由 ----
    location /api/ {
        proxy_pass http://host.docker.internal:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ---- 根路径 / SPA ----
    # 代理到 HyperPush NestJS BFF，处理管理后台 SPA 和未匹配的路径
    # /codepush/ 路由必须定义在此 block 之前，否则会被此 block 捕获
    location / {
        proxy_pass http://host.docker.internal:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name hyperpush.org;
    return 301 https://$host$request_uri;
}
