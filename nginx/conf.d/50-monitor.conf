# ==========================================
# 监控面板 — monitor.joyminis.com
# ==========================================
# 访问 infra-platform Grafana（通过 host.docker.internal 跨 compose 访问）
# Grafana 容器暴露宿主机端口 3001
#
# SSO 流程：
#   1. HyperPush 前端重定向到 /explore?token=xxx
#   2. Nginx auth_request 验证 token → 设置 X-WEBAUTH-USER → Grafana 认证
#   3. 同时将 token 存入 cookie（monitor_token），后续请求自动携带
#   4. 后续请求从 cookie 读取 token → auth_request 验证 → X-WEBAUTH-USER 设置
# ==========================================

# ---- 条件性 Set-Cookie：仅当 URL 有 token 时设置 cookie ----
map $arg_token $monitor_token_cookie {
    ""      "";
    default "monitor_token=$arg_token; Path=/; Max-Age=86400; SameSite=Lax";
}

server {
    listen 443 ssl;
    http2 on;
    server_name monitor.joyminis.com;

    # ---- SSL（自签名证书，Cloudflare Full 模式使用）----
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 10m;

    access_log /dev/stdout combined;
    error_log  /dev/stderr warn;

    # ---- 安全头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header X-Forwarded-Proto https;

    # ---- Auth Service — JWT Token 验证 ----
    # 策略：
    #   - 优先从 URL ?token=xxx 提取 token
    #   - URL 没有 token → 从 cookie monitor_token 提取
    #   - 都没有 → 返回 200（无 email，让 Grafana 处理）
    #
    # proxy_pass URL 不含变量，避免 Nginx resolver 问题
    location = /auth/v {
        internal;

        # 从原始请求 URI 提取 token
        set $sso_token "";
        if ($request_uri ~ [?&]token=([^&]+)) {
            set $sso_token $1;
        }

        # URL 没有 token → 尝试从 cookie 提取
        if ($sso_token = "") {
            set $sso_token $cookie_monitor_token;
        }

        # 仍无 token → 跳过验证
        if ($sso_token = "") {
            return 200;
        }

        # 验证 token（X-Token 请求头，proxy_pass URL 固定无变量）
        proxy_set_header X-Token $sso_token;
        proxy_pass http://host.docker.internal:3004/auth/validate-token;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ---- Grafana 反向代理（Auth Proxy SSO）----
    location / {
        # auth_request 在所有请求上都触发
        #   - URL 有 token 或 cookie 有 token → auth service 验证 → X-WEBAUTH-USER 设置
        #   - 都没有 → /auth/v 返回 200（无 header）→ Grafana 处理
        auth_request /auth/v;
        auth_request_set $auth_email $upstream_http_x_email;
        proxy_set_header X-WEBAUTH-USER $auth_email;

        # 如果 URL 中有 token，设置 cookie 供后续请求使用
        # map $arg_token $monitor_token_cookie 在 http 块中定义
        add_header Set-Cookie $monitor_token_cookie;

        proxy_pass http://host.docker.internal:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
    }
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name monitor.joyminis.com;
    return 301 https://$host$request_uri;
}

# 安全探针拦截
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location ~* /(\.env|\.git|\.htaccess|\.htpasswd|backup\.sql|dump\.sql|phpinfo\.php|wp-login\.php|wp-admin|\.DS_Store) {
        access_log off;
        return 444;
    }
}