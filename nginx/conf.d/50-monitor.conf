# ==========================================
# 监控面板 — monitor.joyminis.com
# ==========================================
# 访问 infra-platform Grafana（通过 host.docker.internal 跨 compose 访问）
# Grafana 容器暴露宿主机端口 3001
# ==========================================
# 域名归属:
#   infra-platform 项目 — 独立监控栈 (Loki + Grafana + Promtail)
#   由 Cloudflare 橙云提供 TLS，本配置使用自签名证书配合 Cloudflare Full 模式
# ==========================================

server {
    listen 443 ssl;
    http2 on;
    server_name monitor.joyminis.com;

    # ---- SSL（自签名证书，Cloudflare Full 模式使用）----
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 10m;

    access_log /dev/stdout combined;
    error_log  /dev/stderr warn;

    # ---- 安全头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_set_header X-Forwarded-Proto https;

    # ---- Auth Service — 内部验证端点（不对外暴露）----
    # 接收 token 参数，转发到 auth-service 验证 JWT 签名
    location = /auth/validate-token {
        internal;
        proxy_pass http://host.docker.internal:3004/validate-token?token=$arg_token;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
    }

    # ---- Grafana 反向代理（Auth Proxy SSO）----
    # 1. 先验证 token → auth-service 验签
    # 2. 通过后设置 X-WEBAUTH-USER header → Grafana 自动登录
    # 3. 从 URL 移除 token 参数再转发
    location / {
        auth_request /auth/validate-token;
        auth_request_set $auth_email $upstream_http_x_email;

        # 验证通过后，把 email 传给 Grafana
        proxy_set_header X-WEBAUTH-USER $auth_email;

        # Grafana 容器在宿主机暴露 3001 端口
        proxy_pass http://host.docker.internal:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
    }
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name monitor.joyminins.com;
    return 301 https://$host$request_uri;
}

# 安全探针拦截
server {
    listen 443 ssl;
    server_name monitor.joyminins.com;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    location ~* /(\.env|\.git|\.htaccess|\.htpasswd|backup\.sql|dump\.sql|phpinfo\.php|wp-login\.php|wp-admin|\.DS_Store) {
        access_log off;
        return 444;
    }
}
