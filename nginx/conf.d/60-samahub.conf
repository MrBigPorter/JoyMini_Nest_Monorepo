# ==========================================
# SamaHub API Gateway — api.samahub.com
# ==========================================
# SamaHub 智能客服平台
# 通过 host.docker.internal 访问同一 VPS 上的 SamaHub 后端
# Cloudflare Full SSL 终止（443 HTTPS + 80→301 跳转）
# ==========================================

server {
    listen 443 ssl;
    http2 on;
    server_name api.samahub.com samahub.com;

    # ---- SSL（自签名证书，Cloudflare Full 模式使用）----
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 10m;

    proxy_ssl_server_name on;

    # 使用变量强制运行时 DNS 解析，而非 worker 启动时缓存
    set $samahub_upstream http://host.docker.internal:4000;

    access_log /dev/stdout combined;
    error_log  /dev/stderr warn;

    client_max_body_size 500M;

    # ---- 安全头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cloudflare 已终止 SSL，告知后端请求来自 HTTPS
    proxy_set_header X-Forwarded-Proto https;

    # ========================================================
    #  0. 安全探针拦截（bot/scanner 扫描，444 静默丢弃）
    # ========================================================
    location ~* /(\.env|\.git|\.htaccess|\.htpasswd|backup\.sql|dump\.sql|phpinfo\.php|wp-login\.php|wp-admin|\.DS_Store) {
        access_log off;
        return 444;
    }

    # ========================================================
    #  A. WebSocket / Socket.IO
    # ========================================================
    location ^~ /socket.io/ {
        proxy_pass $samahub_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ========================================================
    #  B. GraphQL API + 通用路由
    # ========================================================
    location / {
        limit_req zone=api_limit burst=50 nodelay;

        # CORS
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,x-lang,x-csrf-token,x-xsrf-token" always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Content-Length 0 always;
            return 204;
        }

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_pass $samahub_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# HTTP → HTTPS 跳转
server {
    listen 80;
    server_name api.samahub.com samahub.com;
    return 301 https://$host$request_uri;
}
