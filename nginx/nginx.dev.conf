# ==========================================
# Nginx 开发环境配置 (JoyMinis)
# ==========================================

# 注意：在 conf.d/*.conf 中不需要 events 和 http 块
# 这里的配置会自动放入主配置的 http 块内

# Gzip 压缩
gzip on;
gzip_min_length 1k;
gzip_types application/json text/plain application/javascript text/css application/xml;

# 预检请求分流
map $request_method $is_options {
    default 0;
    OPTIONS 1;
}

# ==========================================
# HTTPS 443
# ==========================================
server {
    listen 443 ssl;
    http2 on;

    server_name admin-dev.joyminis.com dev-api.joyminis.com dev.joyminis.com blog-dev.joyminis.com;

    ssl_certificate     /etc/nginx/certs/dev.joyminis.com.pem;
    ssl_certificate_key /etc/nginx/certs/dev.joyminis.com-key.pem;

    proxy_ssl_server_name on;

    access_log /dev/stdout combined;
    error_log  /dev/stderr warn;

    client_max_body_size 500M;

    # Docker 内置 DNS
    resolver 127.0.0.11 valid=5s ipv6=off;

    # ========================================================
    #  A. 静态文件 & 特殊业务
    # ========================================================
    location = /share.html {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream/api/v1/share.html$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /.well-known/ {
        root /var/www/html;
        try_files $uri $uri/ =404;

        if ($uri ~* "\.json$") {
            add_header Content-Type application/json always;
        }
        if ($uri ~* "apple-app-site-association$") {
            add_header Content-Type application/json always;
        }

        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        add_header Cache-Control "public, max-age=3600";
    }

    # ========================================================
    #  B. 支付 Webhook
    # ========================================================
    location ~ ^/api/(v1/)?payment/webhook/xendit {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ========================================================
    #  C. 媒体处理 (Cloudflare + Redirect)
    # ========================================================
    location ~ "^/cdn-cgi/image/[^/]+/(uploads/.*)$" {
        add_header Access-Control-Allow-Origin "*" always;
        if ($is_options) { return 204; }
        return 302 https://img.joyminis.com/$1;
    }

    location ~ "^/cdn-cgi/image/[^/]+/(https?:)/*(.*)" {
        add_header Access-Control-Allow-Origin "*" always;
        if ($is_options) { return 204; }
        return 302 $1//$2;
    }

    location ^~ /uploads/ {
        add_header Access-Control-Allow-Origin "*" always;
        if ($is_options) { return 204; }
        return 302 https://img.joyminis.com$request_uri;
    }

    # ========================================================
    #  D. 核心 API
    # ========================================================
    location = /api/v1/admin/finance/adjust {
        include /etc/nginx/conf.d/whitelist.conf;
        deny all;

        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    location ~ ^/(docs|swagger-ui|api-json) {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        proxy_hide_header 'Access-Control-Allow-Origin';
        proxy_hide_header 'Access-Control-Allow-Credentials';

        if ($is_options) {
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS, PUT, DELETE, PATCH' always;
            add_header Access-Control-Allow-Headers '*' always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }

        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Headers '*' always;

        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ^~ /auth/ {
        if ($is_options) {
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers '*' always;
            return 204;
        }

        add_header Access-Control-Allow-Origin '*' always;
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream/api/v1$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /socket.io/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # ========================================================
    #  F. Admin & Blog 前端 (Next.js HMR)
    # ========================================================
    location ^~ /_next/ {
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        if ($host = 'blog-dev.joyminis.com') {
            set $next_upstream http://frontend-blog:4002;
        }
        if ($host != 'blog-dev.joyminis.com') {
            set $next_upstream http://admin-next:4001;
        }
        proxy_pass $next_upstream;
    }

    location / {
        if ($host = 'blog-dev.joyminis.com') {
            set $blog_next_upstream http://frontend-blog:4002;
            proxy_pass $blog_next_upstream;
            break;
        }

        set $admin_next_upstream http://admin-next:4001;
        proxy_pass $admin_next_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_next_upstream error timeout http_502 http_503;
    }
}

# ==========================================
# HTTP → HTTPS 跳转
# ==========================================
server {
    listen 80;
    server_name admin-dev.joyminis.com dev-api.joyminis.com dev.joyminis.com blog-dev.joyminis.com;
    return 301 https://$host$request_uri;
}