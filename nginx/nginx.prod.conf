# ==========================================
# Nginx 生产环境配置 (纯 API 数据中心)
# ==========================================
# 特点：
#   - 专属 API 域名 (api.joyminis.com)
#   - Swagger 文档禁止外部访问
#   - 生产级 SSL + 安全头
#   - Gzip 压缩 + 限流保护
# ==========================================

# Gzip 压缩
gzip on;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_vary on;
gzip_proxied any;
gzip_types
    application/json
    application/javascript
    application/xml
    text/plain
    text/css
    text/javascript
    image/svg+xml;

# 预检请求分流
map $request_method $is_options {
    default 0;
    OPTIONS 1;
}

# 通用 API 限流 (每秒 20 请求 / IP，突发 50)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# 公开博客 API 限流 (每秒 10 请求 / IP，突发 20) — 防止爬虫，同时允许正常页面并发
limit_req_zone $binary_remote_addr zone=blog_public_limit:10m rate=10r/s;

# 代理缓存 — 公开 GET 响应缓存 1 分钟，减少后端压力
proxy_cache_path /var/cache/nginx/public_api levels=1:2 keys_zone=public_cache:10m max_size=1g inactive=60m use_temp_path=off;

# ==========================================
# HTTPS 443 — 主服务 (API 网关)
# ==========================================
server {
    listen 443 ssl;
    http2 on;

    server_name api.joyminis.com;

    # ---- SSL ----
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:2m;
    ssl_session_timeout 10m;

    proxy_ssl_server_name on;

    access_log /dev/stdout combined;
    error_log  /dev/stderr warn;

    client_max_body_size 50M;

    # ---- 安全头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ========================================================
    #  0. 安全探针拦截（bot/scanner 扫描，444 静默丢弃）
    # ========================================================
    # 常见扫描路径：.env / .git / phpinfo / backup 等
    # 444 = Nginx 直接关闭连接，不返回任何响应，最有效阻止 bot 重试
    location ~* /(\.env|\.git|\.htaccess|\.htpasswd|backup\.sql|dump\.sql|phpinfo\.php|wp-login\.php|wp-admin|\.DS_Store) {
        access_log off;
        return 444;
    }

    # ========================================================
    #  A. 静态文件 & 特殊业务
    # ========================================================

    location = /share.html {
        proxy_pass http://backend:3000/api/v1/share.html$is_args$args;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /.well-known/ {
        root /var/www/html;
        
        # 设置正确的Content-Type
        # 注意：不能在if块内使用default_type，所以使用map指令来处理
        try_files $uri $uri/ =404;
        
        # 根据文件类型设置Content-Type
        # 对于JSON文件
        if ($uri ~* "\.json$") {
            add_header Content-Type application/json always;
        }
        # 对于apple-app-site-association文件
        if ($uri ~* "apple-app-site-association$") {
            add_header Content-Type application/json always;
        }
        
        # 添加CORS头，允许所有来源访问（Android/iOS系统需要）
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
        
        # 缓存控制 - 系统会缓存这些文件
        add_header Cache-Control "public, max-age=3600";
    }

    # ========================================================
    #  B. 支付 Webhook (不限流)
    # ========================================================
    location ~ ^/api/(v1/)?payment/webhook/xendit {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ========================================================
    #  C. 媒体处理 (已停用)
    # ========================================================
    # 2026-03-21: 图片/媒体统一走 Cloudflare 图片域名（img.joyminis.com），
    # 不再通过 api.joyminis.com 进行 /cdn-cgi/image 或 /uploads 转发。
    # 若需回滚，请恢复历史版本中的三个 location 块：
    # - location ^~ /cdn-cgi/image/
    # - location ~* ^/uploads/.*\.(mp4|mov|m4a)$
    # - location ^~ /uploads/

    # ========================================================
    #  C.1 公开博客 API (前端博客 + 客户端配置) — 严格限流 + 代理缓存
    # ========================================================
    location ~ ^/api/v1/(frontend/blog|client/system-config) {
        # 限流：10 req/s per IP，突发 20 — 允许正常页面并发加载，同时阻挡爬虫
        limit_req zone=blog_public_limit burst=20 nodelay;

        # 代理缓存：只缓存 GET 的 200/301/302/304 响应，过期 60s
        proxy_cache public_cache;
        # Include Origin in cache key to avoid serving wrong CORS headers across origins
        proxy_cache_key "$scheme$proxy_host$uri$is_args$args$http_origin";
        proxy_cache_valid 200 301 302 304 60s;
        # Inform downstream caches (including Cloudflare) that response varies by Origin
        add_header Vary "Origin, Accept-Encoding" always;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        add_header X-Cache-Status $upstream_cache_status;

        # ⭐ CORS headers for ALL responses (not just OPTIONS) ⭐
        # This ensures browser receives Access-Control-Allow-Origin even when
        # backend returns an error (5xx/timeout) without CORS headers.
        # Hide NestJS's CORS headers to prevent duplicate headers that can
        # cause CORS failures in some browsers (e.g. iOS WebKit).
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        # 处理预检请求
        # NOTE: nginx scoping — add_header inside if{} REPLACES parent block add_header,
        # so we must also set Access-Control-Allow-Origin/Credentials here.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,x-lang,x-csrf-token,x-xsrf-token,x-skip-auth-refresh" always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Content-Length 0 always;
            return 204;
        }

        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ========================================================
    #  D. 核心 API (通用)
    # ========================================================

    # 调账白名单
    location = /api/v1/admin/finance/adjust {
        include /etc/nginx/conf.d/whitelist.conf;
        deny all;

        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 🚫 生产环境：Swagger 仅允许白名单访问
    location ~ ^/(docs|swagger-ui|api-json) {
        include /etc/nginx/conf.d/whitelist.conf;
        deny all;

        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 通用 API (含上传超时 + 限流)
    # CORS 头设置在块级别（非仅 OPTIONS），确保即使后端报错时浏览器也能收到 CORS 头。
    # 隐藏 NestJS 的 enableCors() 重复头，避免浏览器因重复 CORS 头拒绝响应。
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;

        # ⭐ CORS headers for ALL responses (not just OPTIONS) ⭐
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Credentials;
        add_header Access-Control-Allow-Origin  $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;

        # 处理预检请求
        # NOTE: nginx scoping — add_header inside if{} REPLACES parent block add_header
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $http_origin always;
            add_header Access-Control-Allow-Credentials "true" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization,x-lang,x-csrf-token,x-xsrf-token,x-skip-auth-refresh" always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Type "text/plain; charset=utf-8" always;
            add_header Content-Length 0 always;
            return 204;
        }

        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;


        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ========================================================
    #  D.1 OAuth 授权路由 (/auth/) - 代理到后端 API
    # ========================================================
    location ^~ /auth/ {
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # 处理预检请求
        if ($is_options) {
            add_header Access-Control-Allow-Origin '*' always;
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS' always;
            add_header Access-Control-Allow-Headers '*' always;
            add_header Access-Control-Max-Age 1728000 always;
            add_header Content-Type 'text/plain; charset=utf-8';
            add_header Content-Length 0;
            return 204;
        }

        add_header Access-Control-Allow-Origin '*' always;
        add_header Access-Control-Allow-Headers '*' always;

        # 转发到后端时需要加上 /api/v1 前缀，因为 NestJS 有全局前缀和版本
        # /auth/xxx → /api/v1/auth/xxx
        proxy_pass http://backend:3000/api/v1$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # OAuth 回调需要保持 URL 参数
        proxy_set_header X-Original-URI $request_uri;
    }

    # ========================================================
    #  E. WebSocket / Socket.IO
    # ========================================================
    location ^~ /socket.io/ {
        proxy_pass http://backend:3000;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}

# ==========================================
# HTTP → HTTPS 跳转
# ==========================================
server {
    listen 80;
    server_name api.joyminis.com;
    return 301 https://$host$request_uri;
}

